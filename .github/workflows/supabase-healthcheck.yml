name: Supabase database health check

on:
  schedule:
    # UTC; Taiwan time 09:17, 17:17, and 01:17.
    - cron: '17 1,9,17 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/supabase-healthcheck.yml'
      - 'scripts/supabase-healthcheck.mjs'
      - 'supabase-config.js'

permissions:
  contents: read

concurrency:
  group: supabase-healthcheck
  cancel-in-progress: false

jobs:
  database:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Check database membership function without retrieving records
        run: node scripts/supabase-healthcheck.mjs
